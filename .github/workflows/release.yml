name: Build Windows release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build application
        shell: pwsh
        run: ./build.ps1 -Python python
      - name: Test cursor builder
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Package distribution
        shell: pwsh
        run: |
          if (!(Test-Path dist/PetCursor/PetCursor.exe)) { throw 'Executable missing' }
          if (!(Test-Path dist/PetCursor/_internal)) { throw 'Runtime folder missing' }
          Compress-Archive -Path dist/PetCursor/* -DestinationPath PetCursor-win64.zip
          $hash = (Get-FileHash PetCursor-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  PetCursor-win64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'v1.0.0 already exists; choose a new release tag.' }
          gh release create v1.0.0 PetCursor-win64.zip SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Pet Cursor v1.0.0' --notes 'Windows 64-bit portable release. Extract the ZIP and run PetCursor.exe. The first background removal downloads the model.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
